<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Local SERP Checker is installed</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #071334;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: #ffffff; }
    main {
      width: min(1586px, 100%);
      margin: 0 auto;
      padding: 23px 0 10px;
    }
    header { text-align: center; padding: 0 12px; }
    h1 {
      margin: 0;
      font-size: clamp(29px, 3.65vw, 58px);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.045em;
      color: #091333;
    }
    h1 .name { color: #1753ed; }
    .intro {
      margin: 7px auto 0;
      max-width: 1300px;
      color: #64708a;
      font-size: clamp(15px, 1.56vw, 24px);
      line-height: 1.32;
      font-weight: 500;
      letter-spacing: -0.015em;
    }
    figure {
      margin: 8px 0 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    figure img {
      display: block;
      width: 100%;
      height: auto;
      max-height: calc(100svh - 140px);
      object-fit: contain;
      object-position: center top;
    }
    @media (max-width: 760px) {
      main { padding-top: 24px; }
      h1 { letter-spacing: -0.035em; }
      .intro { max-width: 560px; }
      figure { margin-top: 16px; }
      figure img { max-height: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1><span class="name">Local SERP Checker</span> is installed</h1>
      <p class="intro">Choose location &amp; language (1), search and review results (2), and export them (3).</p>
    </header>
    <figure>
      <img
        src="welcome-steps.png"
        alt="Local SERP Checker: 1 — Choose location and language; 2 — Review search results; 3 — Export results."
        width="1586"
        height="845"
      >
    </figure>
  </main>
</body>
</html>
